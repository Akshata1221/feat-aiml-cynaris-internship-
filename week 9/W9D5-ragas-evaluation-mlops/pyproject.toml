[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-research-report-agent"
version = "1.0.0"
description = "Multi-agent research report pipeline using CrewAI and the AI/ML 3M stack"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0.1", "pydantic>=2.7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
